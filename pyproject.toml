[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crucible"
version = "0.1.0"
description = "A self-improving fine-tuning pipeline: QLoRA SFT, an LLM judge, and DPO on the judge's preferences"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Chrissie Raj"}]
requires-python = ">=3.10"
keywords = ["qlora", "dpo", "lora", "fine-tuning", "llm-judge", "preference-tuning", "peft"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # torch is installed separately from the CUDA index; see the Makefile.
    "torch>=2.6",
    "transformers>=4.46",
    "datasets>=3.0",
    "accelerate>=1.0",
    "peft>=0.13",
    "trl>=0.12",
    "bitsandbytes>=0.45",
    "pandas>=2.0",
    "pyarrow>=17",
    "matplotlib>=3.8",
    "httpx>=0.27",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/Chrissie-1/crucible-qlora-dpo-finetuning-with-llm-judge"

[project.optional-dependencies]
onnx = ["onnx>=1.17", "onnxruntime-gpu>=1.20", "optimum>=1.23"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["crucible*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
